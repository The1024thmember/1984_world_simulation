<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>1984 World Simulation</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>1984 World Simulation</h1>
      <p>Interactive simulation with live analytics and export.</p>
    </header>

    <main>
      <section class="panel controls">
        <h2>Controls</h2>
        <div class="grid">
          <label>Steps
            <input id="steps" type="number" min="10" max="5000" value="300" />
          </label>
          <label>Seed
            <input id="seed" type="number" min="1" max="999999" value="42" />
          </label>
          <label>Grid Width
            <input id="width" type="number" min="10" max="60" value="25" />
          </label>
          <label>Grid Height
            <input id="height" type="number" min="10" max="60" value="25" />
          </label>
          <label>Population
            <input id="population" type="number" min="50" max="2000" value="400" />
          </label>
          <label>Inner Party %
            <input id="innerPct" type="number" min="1" max="10" value="2" />
          </label>
          <label>Outer Party %
            <input id="outerPct" type="number" min="5" max="30" value="13" />
          </label>
          <label>Proles %
            <input id="prolePct" type="number" min="50" max="95" value="85" />
          </label>
          <label>Bomb Frequency
            <input id="bombFreq" type="number" min="0" max="1" step="0.01" value="0.2" />
          </label>
          <label>Bomb Size
            <input id="bombSize" type="number" min="1" max="10" value="3" />
          </label>
          <label>Bomb Intensity
            <input id="bombIntensity" type="number" min="1" max="10" value="3" />
          </label>
          <label>Food Consume Min
            <input id="foodCMin" type="number" min="0.5" max="5" step="0.1" value="1" />
          </label>
          <label>Food Consume Max
            <input id="foodCMax" type="number" min="0.5" max="8" step="0.1" value="3" />
          </label>
          <label>Food Produce Min
            <input id="foodPMin" type="number" min="0.5" max="8" step="0.1" value="2" />
          </label>
          <label>Food Produce Max
            <input id="foodPMax" type="number" min="0.5" max="12" step="0.1" value="4" />
          </label>
          <label>Weapon Produce Min
            <input id="weaponPMin" type="number" min="0.5" max="6" step="0.1" value="1" />
          </label>
          <label>Weapon Produce Max
            <input id="weaponPMax" type="number" min="0.5" max="10" step="0.1" value="3" />
          </label>
        </div>
        <div class="buttons">
          <button id="init">Initialize</button>
          <button id="play">Play</button>
          <button id="pause">Pause</button>
          <button id="step">Step</button>
          <button id="reset">Reset</button>
          <button id="export">Export Image</button>
        </div>
        <div class="status" id="status">Ready.</div>
      </section>

      <section class="panel viz">
        <div class="legend">
          <span><i class="dot inner"></i>Inner Party</span>
          <span><i class="dot outer"></i>Outer Party</span>
          <span><i class="dot prole"></i>Proles</span>
          <span><i class="dot rebel"></i>Rebel (outline)</span>
        </div>
        <div class="death-legend" id="deathLegend"></div>
        <div class="row">
          <canvas id="grid" width="500" height="500"></canvas>
          <canvas id="plot" width="600" height="500"></canvas>
        </div>
      </section>
    </main>

    <footer>
      <small>All simulation runs in-browser. No server required.</small>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
